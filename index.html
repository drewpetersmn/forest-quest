const categories=['All',...new Set(state.tasks.map(t=>t.category))];document.getElementById('quests').innerHTML=`<div class="card"><div class="between"><h2 class="title">📜 Quest Journal</h2><span class="small">${done} / ${state.tasks.length} cleared</span></div><div class="filters" id="filters"><button data-filter="All" class="active" onclick="setFilter('All')">All</button><button data-filter="P1" onclick="setFilter('P1')">🔴 Urgent</button><button data-filter="P2" onclick="setFilter('P2')">🟡 Next</button><button data-filter="P3" onclick="setFilter('P3')">🔵 Later</button><button data-filter="Open" onclick="setFilter('Open')">Open</button><button data-filter="Done" onclick="setFilter('Done')">Done</button></div><div id="tasklist"></div></div><div class="card"><h2 class="title">➕ New quest</h2><label class="formlabel" for="newname">Quest description</label><input class="field" id="newname" placeholder="What needs to get done?" maxlength="220"><label class="formlabel" for="newpriority">Priority</label><select class="field" id="newpriority"><option value="1">🔴 Priority 1 · 100 XP</option><option value="2" selected>🟡 Priority 2 · 60 XP</option><option value="3">🔵 Priority 3 · 30 XP</option></select><label class="formlabel" for="newcategory">Category</label><input class="field" id="newcategory" value="New Quests" maxlength="50"><button class="btn" onclick="addTask()">Add to journal +</button></div>`;
document.getElementById('inventory').innerHTML=`<div class="card"><h2 class="title">🛡️ Guardian's Wardrobe</h2><p class="small">Level up by completing quests. Tap unlocked gear to equip it.</p><div class="shop">${gear.map(g=>`<div class="item ${lvl<g.level?'locked':''}"><span class="emoji">${g.icon}</span><h3>${g.name}</h3><div class="small">${lvl<g.level?'🔒 Unlock at Level '+g.level:state.equipment[g.slot]===g.id?'✓ Equipped':'Unlocked'}</div><button class="btn secondary" style="margin-top:10px" ${lvl<g.level?'disabled':''} onclick="equip('${g.slot}','${g.id}')">${state.equipment[g.slot]===g.id?'Equipped':'Equip'}</button></div>`).join('')}</div></div>`;
const buildings=[['🌱','Sprout Garden',1],['🏡','First Treehouse',2],['🌉','Rope Bridge',3],['🏘️','Forest Village',4],['🏮','Lantern Walk',5],['🌲','Ancient Grove',7],["🏰","Guardian’s Lookout",9],['✨','Starlight Shrine',12],['🐿️','Woodland Friends',15]];document.getElementById('village').innerHTML=`<div class="card"><h2 class="title">🌳 Your Growing Village</h2><p class="small">Every milestone brings the grove to life. Your buildings unlock automatically as you level up.</p><div class="villagegrid">${buildings.map(b=>`<div class="building" style="opacity:${lvl>=b[2]?1:.45}"><span>${lvl>=b[2]?b[0]:'🔒'}</span><strong style="font-size:12px">${b[1]}</strong><div class="small">Level ${b[2]}</div></div>`).join('')}</div></div><div class="card"><h2 class="title">🏆 Adventure Chronicle</h2><p class="small">Your latest quest victories and treasures.</p>${state.rewardHistory.slice(0,8).map(r=>`<div class="task"><span> ${r.chest?'🎁':'⭐'} </span><div><strong>${escapeHTML(r.task)}</strong><div class="small">+${r.xp} XP · ${new Date(r.date).toLocaleDateString()}${r.unlocks.length?' · '+escapeHTML(r.unlocks.join(', ')):''}</div></div></div>`).join('')||'<p class="small">Complete your first quest to begin your chronicle.</p>'}</div><div class="card"><h2 class="title">⚙️ Grove Settings</h2><label class="formlabel" for="guardianname">Name your guardian</label><input class="field" id="guardianname" maxlength="22" value="${escapeHTML(state.name)}"><button class="btn secondary" onclick="rename()">Save name</button><details><summary>Backup & restore progress</summary><p class="small">Progress is saved on this device in this browser. Export a backup before clearing browser data or changing phones. No account or cloud sync is included.</p><button class="btn secondary" onclick="backup()">⬇ Export save file</button><p class="small">Restore a previously exported Forest Quest JSON save:</p><input class="field" type="file" id="restore" accept="application/json,.json" onchange="restoreSave(this)"></details><details><summary>Reset adventure</summary><p class="small">This permanently removes your current quests and progress on this device.</p><button class="btn danger" onclick="resetAdventure()">Reset everything</button></details></div>`;
window.setFilter(window.currentFilter||'All');switchTab(state.tab||'home',false)}
function setFilter(f){window.currentFilter=f;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));let ts=state.tasks.filter(t=>f==='All'||f==='Open'&&!t.done||f==='Done'&&t.done||f==='P'+t.priority);ts.sort((a,b)=>Number(a.done)-Number(b.done)||a.priority-b.priority||a.id-b.id);document.getElementById('tasklist').innerHTML=ts.map(taskHTML).join('')||'<p class="muted">No quests in this view.</p>'}
function switchTab(tab,persist=true){state.tab=tab;document.querySelectorAll('.app>section').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(persist)save();window.scrollTo({top:0,behavior:'smooth'})}function toggle(id){let t=state.tasks.find(t=>t.id===id);if(!t)return;const oldLevel=level(),oldXP=xp();t.done=!t.done;const completed=t.done;const newLevel=level();if(completed){const unlocks=gear.filter(g=>g.level>oldLevel&&g.level<=newLevel).map(g=>g.icon+' '+g.name);const buildings=[['🌱','Sprout Garden',1],['🏡','First Treehouse',2],['🌉','Rope Bridge',3],['🏘️','Forest Village',4],['🏮','Lantern Walk',5],['🌲','Ancient Grove',7],['🏰',"Guardian's Lookout",9],['✨','Starlight Shrine',12],['🐿️','Woodland Friends',15]];unlocks.push(...buildings.filter(b=>b[2]>oldLevel&&b[2]<=newLevel).map(b=>b[0]+' '+b[1]));const chest=xpFor(t.priority)>=60;state.chestsOpened+=(chest?1:0);state.lastRewardAt=new Date().toISOString();state.rewardHistory.unshift({task:t.name,xp:xpFor(t.priority),date:state.lastRewardAt,level:newLevel,unlocks,chest});state.rewardHistory=state.rewardHistory.slice(0,80);save();render();showReward(t,xpFor(t.priority),newLevel>oldLevel,unlocks,chest)}else{save();render();notify('Quest reopened · XP adjusted. Previously earned treasures stay in your collection.')}}
function showReward(t,points,leveled,unlocks,chest){const modal=document.getElementById('reward');const icon=chest?'🎁':'🌟';modal.innerHTML=`<div class="reward-panel"><span class="reward-icon">${icon}</span><div class="eyebrow">QUEST COMPLETE</div><h2 class="reward-title">${chest?'Treasure discovered!':'A forest victory!'}</h2><p>${escapeHTML(t.name)}</p><div class="reward-chip">✨ +${points} XP earned</div>${leveled?`<div class="reward-chip">🎉 LEVEL UP! You are now Level ${level()}</div>`:''}${chest?'<div class="reward-chip">🧰 Chest opened! Your village celebrates your progress.</div>':''}${unlocks.length?`<h3>New unlocks!</h3><div class="reward-list">${unlocks.map(x=>`<div class="reward-chip">${escapeHTML(x)}</div>`).join('')}</div>`:''}<button class="btn reward-close" onclick="closeReward()">Continue the adventure →</button></div>`;modal.classList.remove('hidden');document.body.style.overflow='hidden';for(let i=0;i<20;i++){const el=document.createElement('span');el.className='burst';el.textContent=['✨','🍃','⭐','🌼'][i%4];el.style.left=(20+Math.random()*60)+'vw';el.style.top=(25+Math.random()*45)+'vh';el.style.setProperty('--dx',(Math.random()*350-175)+'px');el.style.setProperty('--dy',(Math.random()*-300-30)+'px');document.body.append(el);setTimeout(()=>el.remove(),1500)}}
function closeReward(){document.getElementById('reward').classList.add('hidden');document.body.style.overflow='';const char=document.querySelector('.character');if(char){char.classList.remove('spark');char.classList.add('celebrate');setTimeout(()=>{char.classList.remove('celebrate');char.classList.add('spark')},1800)}}
function addTask(){let name=document.getElementById('newname').value.trim(),priority=Number(document.getElementById('newpriority').value),category=document.getElementById('newcategory').value.trim()||'New Quests';if(!name)return notify('Give your quest a name');state.tasks.push({id:state.nextId++,name,priority,category,done:false});save();render();switchTab('quests');notify('New quest added! 📜')}
function editTask(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;let name=prompt('Edit quest description:',t.name);if(name===null)return;if(!name.trim())return notify('Quest cannot be empty');let p=prompt('Priority: 1 urgent, 2 next, 3 later',t.priority);if(p===null)return;if(!['1','2','3'].includes(p))return notify('Choose priority 1, 2, or 3');let c=prompt('Category:',t.category);if(c===null)return;t.name=name.trim();t.priority=Number(p);t.category=c.trim()||'General';save();render();notify('Quest updated');if(confirm('Delete this quest? Press OK to delete, or Cancel to keep it.')){state.tasks=state.tasks.filter(x=>x.id!==id);save();render();notify('Quest removed')}}
function equip(slot,id){let g=gear.find(x=>x.slot===slot&&x.id===id);if(!g||level()<g.level)return;state.equipment[slot]=id;save();render();notify(`${g.name} equipped!`)}function rename(){state.name=document.getElementById('guardianname').value.trim()||'Pip';save();render();notify('Guardian renamed!')}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forest-quest-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function restoreSave(input){let file=input.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!data.tasks.every(t=>typeof t.name==='string'&&[1,2,3].includes(t.priority)))throw Error('Invalid save');if(!confirm('Replace all current progress with this backup?'))return;state=data;state.nextId ||= Math.max(0,...state.tasks.map(t=>t.id))+1;state.equipment ||= {hood:'basic',weapon:'none'};state.rewardHistory ||= [];state.chestsOpened ||= 0;save();render();notify('Adventure restored!')}catch(e){notify('Could not restore that save file')}}function resetAdventure(){if(!confirm('Reset all quests, levels, and rewards?'))return;if(!confirm('Last chance: permanently erase your local progress?'))return;localStorage.removeItem(KEY);location.reload()}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
